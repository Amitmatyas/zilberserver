<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול השרת - זילבר</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #eee;
            --accent: #ffcc00;
            --danger: #f04747;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px; direction: rtl;
        }

        .admin-container { max-width: 1000px; margin: 0 auto; }
        
        .admin-card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1, h2 { color: var(--accent); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        
        input, textarea, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: white;
            font-family: inherit;
        }

        button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); }

        .item-list { margin-top: 20px; }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #444;
            background: rgba(255,255,255,0.05);
            margin-bottom: 5px;
            border-radius: 5px;
        }

        .player-row { display: grid; grid-template-columns: 1fr 2fr 100px; gap: 10px; align-items: center; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🛠️ פאנל ניהול השרת</h1>

    <div class="grid-2">
        <div class="admin-card">
            <h2>📢 הודעה חדשה</h2>
            <div class="form-group">
                <textarea id="msgInput" placeholder="כתוב הודעה חדשה לשרת..."></textarea>
                <button onclick="addMessage()">פרסם הודעה</button>
            </div>
            <div id="adminMsgList" class="item-list"></div>
        </div>

        <div class="admin-card">
            <h2>📅 יצירת אירוע</h2>
            <div class="form-group">
                <input type="text" id="evtTitle" placeholder="שם האירוע">
                <input type="datetime-local" id="evtStart" placeholder="זמן התחלה">
                <input type="datetime-local" id="evtEnd" placeholder="זמן סיום">
                <select id="evtCountdownTarget">
                    <option value="start">ספירה לאחור להתחלה</option>
                    <option value="end">ספירה לאחור לסיום</option>
                </select>
                <textarea id="evtDesc" placeholder="תיאור מלא (יופיע בלחיצה)"></textarea>
                <button onclick="addEvent()">צור אירוע</button>
            </div>
            <div id="adminEvtList" class="item-list"></div>
        </div>
    </div>

    <div class="admin-card">
        <h2>👥 רשימת שחקנים והערות מנהל</h2>
        <div class="form-group" style="flex-direction: row;">
            <input type="text" id="playerName" placeholder="שם השחקן" style="flex:1">
            <button onclick="addPlayer()">הוסף שחקן</button>
        </div>
        <div id="adminPlayerList" class="item-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDlyDbpwcBcWvFnvYHb84dMEpaQFTjv-HY",
        authDomain: "tester-69fa9.firebaseapp.com",
        projectId: "tester-69fa9",
        storageBucket: "tester-69fa9.firebasestorage.app",
        messagingSenderId: "378563229004",
        appId: "1:378563229004:web:5136b724eb84fd00e44be9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // אבטחה בסיסית
    const pass = prompt("הכנס סיסמת מנהל:");
    if (pass !== "1234") { // שנה את הסיסמה כאן
        alert("גישה נדחתה");
        document.body.innerHTML = "<h1>אין לך הרשאה לצפות בעמוד זה.</h1>";
    }

    // --- לוגיקת הודעות ---
    window.addMessage = async () => {
        const text = document.getElementById('msgInput').value;
        if (!text) return;
        await addDoc(collection(db, "messages"), { text, createdAt: Date.now() });
        document.getElementById('msgInput').value = '';
    };

    onSnapshot(collection(db, "messages"), (snap) => {
        const list = document.getElementById('adminMsgList');
        list.innerHTML = '';
        snap.forEach(d => {
            list.innerHTML += `<div class="item-row">
                <span>${d.data().text}</span>
                <button class="btn-danger" onclick="deleteItem('messages', '${d.id}')">מחק</button>
            </div>`;
        });
    });

    // --- לוגיקת אירועים ---
    window.addEvent = async () => {
        const title = document.getElementById('evtTitle').value;
        const start = document.getElementById('evtStart').value;
        const end = document.getElementById('evtEnd').value;
        const target = document.getElementById('evtCountdownTarget').value;
        const description = document.getElementById('evtDesc').value;

        if (!title || (!start && !end)) {
            alert("חובה שם ולפחות שעה אחת");
            return;
        }

        await addDoc(collection(db, "events"), {
            title,
            start,
            end,
            countdownTarget: target === 'start' ? start : end,
            description,
            createdAt: Date.now()
        });
        alert("אירוע נוצר!");
    };

    onSnapshot(collection(db, "events"), (snap) => {
        const list = document.getElementById('adminEvtList');
        list.innerHTML = '';
        snap.forEach(d => {
            list.innerHTML += `<div class="item-row">
                <span>${d.data().title}</span>
                <button class="btn-danger" onclick="deleteItem('events', '${d.id}')">מחק</button>
            </div>`;
        });
    });

    // --- לוגיקת שחקנים ---
    window.addPlayer = async () => {
        const name = document.getElementById('playerName').value;
        if (!name) return;
        await addDoc(collection(db, "players"), { name, notes: "" });
        document.getElementById('playerName').value = '';
    };

    window.updateNote = async (id, note) => {
        await updateDoc(doc(db, "players", id), { notes: note });
    };

    onSnapshot(collection(db, "players"), (snap) => {
        const list = document.getElementById('adminPlayerList');
        list.innerHTML = '';
        snap.forEach(d => {
            const data = d.data();
            list.innerHTML += `<div class="item-row player-row">
                <strong>${data.name}</strong>
                <input type="text" value="${data.notes}" placeholder="הערות מנהל..." onchange="updateNote('${d.id}', this.value)">
                <button class="btn-danger" onclick="deleteItem('players', '${d.id}')">הסר</button>
            </div>`;
        });
    });

    // פונקציית מחיקה כללית
    window.deleteItem = async (col, id) => {
        if (confirm("בטוח שברצונך למחוק?")) {
            await deleteDoc(doc(db, col, id));
        }
    };

</script>
</body>
</html>
