<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – השרת של זילבר</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117; --sidebar: #13161e; --card: #1b1f2b; --card2: #222636;
            --border: #2a2f42; --primary: #5865F2; --accent: #ffcc00;
            --red: #ed4245; --text: #dde1f0; --muted: #7b82a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }

        /* LOGIN */
        #loginScreen {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 40px 36px; width: 340px; text-align: center;
        }
        .login-box h1 { font-family: 'Varela Round'; color: var(--accent); font-size: 1.6em; margin-bottom: 8px; }
        .login-box .sub { color: var(--muted); font-size: 0.9em; margin-bottom: 24px; }
        #loginPass {
            width: 100%; padding: 12px; background: var(--card2); border: 1px solid var(--border);
            color: var(--text); border-radius: 8px; font-size: 1em; margin-bottom: 12px;
            direction: ltr; text-align: center; outline: none;
        }
        #loginPass:focus { border-color: var(--primary); }
        #loginBtn {
            width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
            border-radius: 8px; font-family: 'Assistant'; font-weight: 700; font-size: 1em; cursor: pointer;
        }
        #loginBtn:hover { background: #4752c4; }
        #loginErr { color: var(--red); font-size: 0.9em; margin-top: 10px; display: none; }

        /* DASHBOARD */
        #dashboard { display: none; }
        .layout { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 220px; flex-shrink: 0; background: var(--sidebar);
            border-left: 1px solid var(--border); padding: 24px 0;
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar-title {
            padding: 0 20px 20px; font-family: 'Varela Round';
            color: var(--accent); font-size: 1.1em; border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .nav-item {
            display: block; padding: 12px 20px; color: var(--muted); cursor: pointer;
            font-size: 0.95em; transition: all 0.2s; border-right: 3px solid transparent;
            user-select: none;
        }
        .nav-item:hover { color: var(--text); background: rgba(88,101,242,0.08); }
        .nav-item.active { color: var(--text); background: rgba(88,101,242,0.14); border-right-color: var(--primary); }

        .main { flex: 1; padding: 30px; overflow-y: auto; }

        /* TABS */
        .tab-section { display: none; }
        .tab-section.active { display: block; }

        /* CARDS */
        .admin-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 22px 24px; margin-bottom: 24px; }
        h2 { font-family: 'Varela Round'; color: var(--primary); font-size: 1.15em; margin-bottom: 18px; }

        /* FORMS */
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
        .form-row label { color: var(--muted); font-size: 0.85em; white-space: nowrap; }
        input[type=text], input[type=date], input[type=time], textarea, select {
            background: var(--card2); border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 9px 12px; font-family: 'Assistant'; font-size: 0.95em; outline: none;
        }
        input[type=text]:focus, textarea:focus, select:focus { border-color: var(--primary); }
        input[type=text] { flex: 1; min-width: 140px; }
        textarea { width: 100%; min-height: 56px; resize: vertical; }

        /* BUTTONS */
        .btn { padding: 9px 18px; border: none; border-radius: 8px; font-family: 'Assistant'; font-weight: 700; font-size: 0.92em; cursor: pointer; transition: background 0.2s; }
        .btn-blue { background: var(--primary); color: #fff; }
        .btn-blue:hover { background: #4752c4; }
        .btn-red { background: rgba(237,66,69,0.14); color: var(--red); border: 1px solid rgba(237,66,69,0.3); padding: 6px 12px; font-size: 0.84em; }
        .btn-red:hover { background: rgba(237,66,69,0.26); }

        /* ITEM ROW */
        .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card2); border-radius: 8px; margin-bottom: 8px; }
        .item-text { flex: 1; font-size: 0.9em; line-height: 1.4; }
        .item-text small { color: var(--muted); }

        /* PLAYER CARD */
        .player-card { background: var(--card2); border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
        .player-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .player-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; }
        .player-info { flex: 1; }
        .player-info strong { display: block; }
        .player-info small { color: var(--muted); font-size: 0.82em; }
        .notes-field { background: rgba(255,255,255,0.03); border: 1px dashed var(--border); color: var(--muted); font-size: 0.88em; border-radius: 6px; padding: 8px 10px; }
    </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
    <div class="login-box">
        <h1>🔐 Admin</h1>
        <p class="sub">השרת של זילבר – ניהול</p>
        <input type="password" id="loginPass" placeholder="סיסמת מנהל">
        <button id="loginBtn">כניסה</button>
        <p id="loginErr">❌ סיסמה שגויה</p>
    </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
    <div class="layout">

        <nav class="sidebar">
            <div class="sidebar-title">⚙️ ניהול</div>
            <span class="nav-item active" data-tab="tab-ann">📢 הודעות</span>
            <span class="nav-item" data-tab="tab-ev">🎯 אירועים</span>
            <span class="nav-item" data-tab="tab-players">👥 שחקנים</span>
            <span class="nav-item" data-tab="tab-rules">📜 חוקים</span>
            <span class="nav-item" data-tab="tab-pun">⚖️ ענישה</span>
        </nav>

        <main class="main">

            <!-- ANNOUNCEMENTS -->
            <section class="tab-section active" id="tab-ann">
                <div class="admin-card">
                    <h2>📢 הודעות</h2>
                    <div class="form-row">
                        <input type="text" id="ann-text" placeholder="טקסט ההודעה...">
                        <button class="btn btn-blue" id="btn-ann">+ הוסף</button>
                    </div>
                    <div id="ann-list"></div>
                </div>
            </section>

            <!-- EVENTS -->
            <section class="tab-section" id="tab-ev">
                <div class="admin-card">
                    <h2>🎯 אירועים</h2>
                    <div class="form-row">
                        <input type="text" id="ev-name" placeholder="שם האירוע" style="flex:1">
                    </div>
                    <div class="form-row">
                        <label>התחלה:</label>
                        <input type="date" id="ev-sd">
                        <input type="time" id="ev-st">
                    </div>
                    <div class="form-row">
                        <label>סיום:</label>
                        <input type="date" id="ev-ed">
                        <input type="time" id="ev-et">
                    </div>
                    <div class="form-row">
                        <input type="text" id="ev-desc" placeholder="תיאור (אופציונלי)" style="flex:1">
                    </div>
                    <div class="form-row">
                        <label>טיימר:</label>
                        <select id="ev-timer">
                            <option value="none">ללא טיימר</option>
                            <option value="start">ספירה לשעת התחלה</option>
                            <option value="end">ספירה לשעת סיום</option>
                        </select>
                        <button class="btn btn-blue" id="btn-ev">+ הוסף אירוע</button>
                    </div>
                    <div id="ev-list"></div>
                </div>
            </section>

            <!-- PLAYERS -->
            <section class="tab-section" id="tab-players">
                <div class="admin-card">
                    <h2>👥 ניהול שחקנים</h2>
                    <div class="form-row">
                        <input type="text" id="p-name" placeholder="שם שחקן">
                        <input type="text" id="p-island" placeholder="אי (ראשי / פרטי / נפרד)">
                        <button class="btn btn-blue" id="btn-player">+ הוסף</button>
                    </div>
                    <p style="color:var(--muted);font-size:0.82em;margin-bottom:14px">💡 שדה ההערות פנימי בלבד – לא גלוי לשחקנים</p>
                    <div id="player-list"></div>
                </div>
            </section>

            <!-- RULES -->
            <section class="tab-section" id="tab-rules">
                <div class="admin-card" style="margin-bottom:20px">
                    <h2>📜 סיכום השרת</h2>
                    <div class="form-row">
                        <input type="text" id="ri-summary" placeholder="אמוג'י" style="flex:0 0 65px">
                        <input type="text" id="rt-summary" placeholder="כותרת">
                        <input type="text" id="rx-summary" placeholder="טקסט">
                        <button class="btn btn-blue" data-rtype="summary">+ הוסף</button>
                    </div>
                    <div id="rule-list-summary"></div>
                </div>
                <div class="admin-card" style="margin-bottom:20px">
                    <h2>⚔️ חוקי לחימה</h2>
                    <div class="form-row">
                        <input type="text" id="ri-combat" placeholder="אמוג'י" style="flex:0 0 65px">
                        <input type="text" id="rt-combat" placeholder="כותרת">
                        <input type="text" id="rx-combat" placeholder="טקסט">
                        <button class="btn btn-blue" data-rtype="combat">+ הוסף</button>
                    </div>
                    <div id="rule-list-combat"></div>
                </div>
                <div class="admin-card">
                    <h2>🛠️ חוקים טכניים</h2>
                    <div class="form-row">
                        <input type="text" id="ri-technical" placeholder="אמוג'י" style="flex:0 0 65px">
                        <input type="text" id="rt-technical" placeholder="כותרת">
                        <input type="text" id="rx-technical" placeholder="טקסט">
                        <button class="btn btn-blue" data-rtype="technical">+ הוסף</button>
                    </div>
                    <div id="rule-list-technical"></div>
                </div>
            </section>

            <!-- PUNISHMENTS -->
            <section class="tab-section" id="tab-pun">
                <div class="admin-card">
                    <h2>⚖️ דרגות ענישה</h2>
                    <div class="form-row">
                        <input type="text" id="pun-off" placeholder="עבירה (למשל: פעם ראשונה)">
                        <input type="text" id="pun-pen" placeholder="עונש (למשל: Kill 💀)">
                        <button class="btn btn-blue" id="btn-pun">+ הוסף</button>
                    </div>
                    <div id="pun-list"></div>
                </div>
            </section>

        </main>
    </div>
</div>

<!-- Firebase (compat, loaded synchronously before our script) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// Everything inside DOMContentLoaded so DOM is ready
document.addEventListener('DOMContentLoaded', function () {

    /* ── FIREBASE ── */
    firebase.initializeApp({
        apiKey: "AIzaSyDlyDbpwcBcWvFnvYHb84dMEpaQFTjv-HY",
        authDomain: "tester-69fa9.firebaseapp.com",
        databaseURL: "https://tester-69fa9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tester-69fa9",
        storageBucket: "tester-69fa9.firebasestorage.app",
        messagingSenderId: "378563229004",
        appId: "1:378563229004:web:5136b724eb84fd00e44be9"
    });
    var db = firebase.database();

    /* ── LOGIN ── */
    var PASS = 'zilber2026';

    document.getElementById('loginBtn').addEventListener('click', tryLogin);
    document.getElementById('loginPass').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') tryLogin();
    });

    function tryLogin() {
        if (document.getElementById('loginPass').value === PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            startDashboard();
        } else {
            document.getElementById('loginErr').style.display = 'block';
        }
    }

    /* ── TABS ── */
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.tab-section').forEach(function(s) { s.classList.remove('active'); });
            document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
            document.getElementById(item.dataset.tab).classList.add('active');
            item.classList.add('active');
        });
    });

    /* ── DASHBOARD ── */
    function startDashboard() {
        setupAnnouncements();
        setupEvents();
        setupPlayers();
        ['summary','combat','technical'].forEach(setupRules);
        setupPunishments();
    }

    /* ── UTIL: delete button ── */
    function delBtn(path) {
        var b = document.createElement('button');
        b.className = 'btn btn-red';
        b.textContent = 'מחק';
        b.onclick = function() { if (confirm('למחוק?')) db.ref(path).remove(); };
        return b;
    }

    /* ── ANNOUNCEMENTS ── */
    function setupAnnouncements() {
        db.ref('announcements').on('value', function(snap) {
            var c = document.getElementById('ann-list');
            c.innerHTML = '';
            var d = snap.val() || {};
            Object.keys(d).forEach(function(id) {
                var a = d[id];
                var row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = '<span class="item-text">📢 ' + a.text + ' <small>' + (a.date||'') + '</small></span>';
                row.appendChild(delBtn('announcements/' + id));
                c.appendChild(row);
            });
        });

        document.getElementById('btn-ann').onclick = function() {
            var t = document.getElementById('ann-text').value.trim();
            if (!t) return;
            db.ref('announcements').push({ text: t, date: new Date().toLocaleDateString('he-IL') });
            document.getElementById('ann-text').value = '';
        };
    }

    /* ── EVENTS ── */
    function setupEvents() {
        db.ref('events').on('value', function(snap) {
            var c = document.getElementById('ev-list');
            c.innerHTML = '';
            var d = snap.val() || {};
            Object.keys(d).forEach(function(id) {
                var e = d[id];
                var row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = '<span class="item-text">🎯 <b>' + e.name + '</b> | ' +
                    (e.startDate||'') + ' ' + (e.startTime||'') + ' – ' + (e.endDate||'') + ' ' + (e.endTime||'') + '</span>';
                row.appendChild(delBtn('events/' + id));
                c.appendChild(row);
            });
        });

        document.getElementById('btn-ev').onclick = function() {
            var name = document.getElementById('ev-name').value.trim();
            if (!name) return;
            var sd = document.getElementById('ev-sd').value;
            var st = document.getElementById('ev-st').value;
            var ed = document.getElementById('ev-ed').value;
            var et = document.getElementById('ev-et').value;
            var desc = document.getElementById('ev-desc').value.trim();
            var choice = document.getElementById('ev-timer').value;
            var timerTarget = null;
            if (choice === 'start' && sd && st) timerTarget = new Date(sd + 'T' + st).toISOString();
            else if (choice === 'end' && ed && et) timerTarget = new Date(ed + 'T' + et).toISOString();
            db.ref('events').push({ name:name, startDate:sd, startTime:st, endDate:ed, endTime:et, description:desc, timerTarget:timerTarget });
            ['ev-name','ev-sd','ev-st','ev-ed','ev-et','ev-desc'].forEach(function(id){ document.getElementById(id).value=''; });
            document.getElementById('ev-timer').value = 'none';
        };
    }

    /* ── PLAYERS ── */
    function setupPlayers() {
        db.ref('players').on('value', function(snap) {
            var c = document.getElementById('player-list');
            c.innerHTML = '';
            var d = snap.val() || {};
            Object.keys(d).forEach(function(id) {
                var p = d[id];
                var card = document.createElement('div');
                card.className = 'player-card';

                var hdr = document.createElement('div');
                hdr.className = 'player-header';
                hdr.innerHTML =
                    '<div class="player-avatar">' + (p.name||'?')[0] + '</div>' +
                    '<div class="player-info"><strong>' + (p.name||'') + '</strong><small>' + (p.island||'ללא אי') + '</small></div>';
                hdr.appendChild(delBtn('players/' + id));

                var notes = document.createElement('textarea');
                notes.className = 'notes-field';
                notes.placeholder = 'הערות פנימיות (לא גלויות לשחקנים)...';
                notes.value = p.notes || '';
                notes.onblur = (function(pid){ return function(){ db.ref('players/'+pid).update({notes: notes.value}); }; })(id);

                card.appendChild(hdr);
                card.appendChild(notes);
                c.appendChild(card);
            });
        });

        document.getElementById('btn-player').onclick = function() {
            var name = document.getElementById('p-name').value.trim();
            if (!name) return;
            var island = document.getElementById('p-island').value.trim();
            db.ref('players').push({ name:name, island:island, notes:'' });
            document.getElementById('p-name').value = '';
            document.getElementById('p-island').value = '';
        };
    }

    /* ── RULES ── */
    function setupRules(type) {
        db.ref('rules/' + type).on('value', function(snap) {
            var c = document.getElementById('rule-list-' + type);
            if (!c) return;
            c.innerHTML = '';
            var d = snap.val() || {};
            Object.keys(d).forEach(function(id) {
                var r = d[id];
                var row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = '<span class="item-text">' + (r.icon||'') + ' <b>' + (r.title||'') + '</b> ' + (r.text||'') + '</span>';
                row.appendChild(delBtn('rules/' + type + '/' + id));
                c.appendChild(row);
            });
        });

        var addBtn = document.querySelector('[data-rtype="' + type + '"]');
        if (addBtn) {
            addBtn.onclick = function() {
                var icon  = document.getElementById('ri-' + type).value.trim();
                var title = document.getElementById('rt-' + type).value.trim();
                var text  = document.getElementById('rx-' + type).value.trim();
                if (!title && !text) return;
                db.ref('rules/' + type).push({ icon:icon, title:title, text:text });
                ['ri-','rt-','rx-'].forEach(function(p){ document.getElementById(p+type).value=''; });
            };
        }
    }

    /* ── PUNISHMENTS ── */
    function setupPunishments() {
        db.ref('rules/punishments').on('value', function(snap) {
            var c = document.getElementById('pun-list');
            c.innerHTML = '';
            var d = snap.val() || {};
            Object.keys(d).forEach(function(id) {
                var p = d[id];
                var row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = '<span class="item-text">⚖️ <b>' + p.offense + '</b> → ' + p.penalty + '</span>';
                row.appendChild(delBtn('rules/punishments/' + id));
                c.appendChild(row);
            });
        });

        document.getElementById('btn-pun').onclick = function() {
            var off = document.getElementById('pun-off').value.trim();
            var pen = document.getElementById('pun-pen').value.trim();
            if (!off || !pen) return;
            db.ref('rules/punishments').push({ offense:off, penalty:pen });
            document.getElementById('pun-off').value = '';
            document.getElementById('pun-pen').value = '';
        };
    }

}); // end DOMContentLoaded
</script>
</body>
</html>
