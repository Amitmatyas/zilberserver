<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השרת של זילבר</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/he/1/14/Minecraft_Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5865F2; --bg-dark: #1a1a1a; --card-bg: #2d2d2d;
            --text-color: #eeeeee; --accent-color: #ffcc00; --highlight-color: #43b581;
        }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg-dark); color: var(--text-color); margin: 0; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 60px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://www.minecraft.net/content/dam/games/minecraft/key-art/Games_Subnav_Minecraft-Wild-Update.jpg'); background-size: cover; border-bottom: 4px solid var(--primary-color); border-radius: 0 0 30px 30px; }
        .ip-box { background: #333; padding: 12px 25px; border-radius: 12px; display: inline-block; margin-top: 15px; border: 2px dashed var(--accent-color); cursor: pointer; transition: 0.3s; position: relative; }
        .ip-box:hover { transform: scale(1.05); }

        /* פריסה דינמית */
        .dynamic-wrapper { display: flex; gap: 20px; margin: 30px 0; flex-wrap: wrap; display: none; }
        .dynamic-wrapper.visible { display: flex; }
        .dynamic-section { background: var(--card-bg); padding: 25px; border-radius: 15px; flex: 1 1 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .dynamic-wrapper.has-both .dynamic-section { flex: 1 1 45%; min-width: 300px; }

        section { background: var(--card-bg); margin: 30px 0; padding: 25px; border-radius: 15px; }
        h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
        
        .event-item { background: rgba(255, 204, 0, 0.05); border: 1px solid var(--accent-color); padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .event-item:hover { background: rgba(255, 204, 0, 0.15); }
        .countdown { font-weight: bold; color: var(--accent-color); display: block; margin-top: 5px; font-size: 1.1em; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; border: 2px solid var(--primary-color); position: relative; }
        .close-btn { position: absolute; left: 20px; top: 15px; font-size: 24px; cursor: pointer; color: #888; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/KcT2psvc/logo.png" style="max-width:150px;">
        <h1 style="color:var(--accent-color)">השרת של זילבר</h1>
        <div class="ip-box" onclick="copyIP()">zilber.minecraft.pe</div>
    </header>

    <div class="container">
        <div id="dynamicWrapper" class="dynamic-wrapper">
            <div id="msgContainer" class="dynamic-section hidden">
                <h2>📢 הודעות</h2>
                <div id="msgList"></div>
            </div>
            <div id="evtContainer" class="dynamic-section hidden">
                <h2>⏳ אירועים</h2>
                <div id="evtList"></div>
            </div>
        </div>

        <section>
            <h2>📜 חוקי השרת</h2>
            <p>השרת שיתופי - נא לכבד את כולם ולא להרוס מבנים באי המרכזי.</p>
        </section>
    </div>

    <div id="evtModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="mTitle" style="color:var(--accent-color)"></h2>
            <div id="mBody"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlyDbpwcBcWvFnvYHb84dMEpaQFTjv-HY",
            authDomain: "tester-69fa9.firebaseapp.com",
            projectId: "tester-69fa9",
            storageBucket: "tester-69fa9.firebasestorage.app",
            messagingSenderId: "378563229004",
            appId: "1:378563229004:web:5136b724eb84fd00e44be9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // סינכרון הודעות
        onSnapshot(collection(db, "messages"), (snap) => {
            const list = document.getElementById('msgList');
            const data = snap.docs.map(d => d.data());
            list.innerHTML = data.map(m => `<p style="border-right:3px solid var(--highlight-color); padding-right:10px">${m.text}</p>`).join('');
            updateLayout();
        });

        // סינכרון אירועים
        onSnapshot(collection(db, "events"), (snap) => {
            const list = document.getElementById('evtList');
            list.innerHTML = snap.docs.map(d => {
                const e = d.data();
                return `
                <div class="event-item" onclick="openModal('${e.title}', '${e.start}', '${e.end}', '${e.description}')">
                    <strong>${e.title}</strong>
                    <span class="countdown" data-target="${e.countdownTarget}">טוען זמן...</span>
                </div>`;
            }).join('');
            updateLayout();
        });

        function updateLayout() {
            const hasMsgs = document.querySelectorAll('#msgList p').length > 0;
            const hasEvts = document.querySelectorAll('.event-item').length > 0;
            const wrapper = document.getElementById('dynamicWrapper');
            
            hasMsgs ? document.getElementById('msgContainer').classList.remove('hidden') : document.getElementById('msgContainer').classList.add('hidden');
            hasEvts ? document.getElementById('evtContainer').classList.remove('hidden') : document.getElementById('evtContainer').classList.add('hidden');

            if(hasMsgs || hasEvts) wrapper.classList.add('visible');
            else wrapper.classList.remove('visible');

            (hasMsgs && hasEvts) ? wrapper.classList.add('has-both') : wrapper.classList.remove('has-both');
        }

        window.openModal = (t, s, e, d) => {
            document.getElementById('mTitle').innerText = t;
            document.getElementById('mBody').innerHTML = `
                <p><b>התחלה:</b> ${new Date(s).toLocaleString('he-IL')}</p>
                ${e ? `<p><b>סיום:</b> ${new Date(e).toLocaleString('he-IL')}</p>` : ''}
                <p>${d || 'אין פירוט נוסף'}</p>
            `;
            document.getElementById('evtModal').style.display = 'block';
        }
        window.closeModal = () => document.getElementById('evtModal').style.display = 'none';

        setInterval(() => {
            document.querySelectorAll('.countdown').forEach(el => {
                const diff = new Date(el.dataset.target) - new Date();
                if(diff <= 0) { el.innerText = "האירוע התחיל/הסתיים"; return; }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                el.innerText = `בעוד: ${h} שעות ו-${m} דקות`;
            });
        }, 1000);

        window.copyIP = () => { navigator.clipboard.writeText("zilber.minecraft.pe"); alert("IP הועתק!"); };
    </script>
</body>
</html>
